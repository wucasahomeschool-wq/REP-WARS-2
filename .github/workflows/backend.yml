name: Backend correctness
on:
  pull_request:
  push:
    branches-ignore: [REP-WARS-3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      REP_WARS_RUN_LIVE_SUPABASE_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run build
      - run: npm test
      - name: Verify tests did not rewrite tracked content
        run: git diff --exit-code
